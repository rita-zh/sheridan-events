name: Collect events

on:
  schedule:
    # Daily at 11:07 UTC = 6:07 AM Toronto in winter (EST), 7:07 AM in summer (EDT).
    # Cron is always UTC. Off the hour because GitHub delays jobs queued at :00.
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these sources, space-separated (ssu clubs edge sheridan). Blank = all."
        required: false
        default: ""

permissions:
  contents: write

# Never run two collections at once (a manual run during the scheduled one)
concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Run collectors
        id: collect
        # A failing source keeps its previous data and makes this exit 2.
        # Carry on so the other sources' fresh data still gets saved; the
        # last step fails the job afterwards so GitHub emails you.
        continue-on-error: true
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python collect.py --only $ONLY
          else
            python collect.py
          fi

      - name: Commit data/events.json (+ the website's copy)
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/events.json frontend/events.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json frontend/events.json
          git commit -m "Update events data ($(date -u +%Y-%m-%d))"
          # Retry if someone pushed in the meantime
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Trigger Render deploy
        # Optional: set the RENDER_DEPLOY_HOOK_URL secret if Render doesn't
        # redeploy by itself when data/events.json changes
        if: steps.commit.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret; relying on Render auto-deploy."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered."
          fi

      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::At least one source failed. Its previous events were kept. See the 'Run collectors' log."
          exit 1
